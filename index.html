<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style/style.css">
</head>
<body>



    <div class="container">
        <h1>Todo List</h1>
        <form name="add">
            <input name="input" type="text" placeholder="todo:">
            <button>Add</button>
        </form>
        <div class="grid">
            <div class="todo">
                <div class="left">
                    <h3 class="title">Buy milk :)</h3>
                    <span class="time">18:44</span>
                </div>
                <button>
                   <svg class="exit" width="16" height="15" viewBox="0 0 16 15" fill="none">
                        <use href="./public/icons/sprite.svg#close"></use>
                   </svg>
                </button>
            </div>
        </div>
    </div>


    <script type="module" src="./app.js"></script>
</body>
</html>
